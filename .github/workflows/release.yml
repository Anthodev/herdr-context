---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release and quality gates
    runs-on: avrea-ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate release and tag contracts
        run: python3 scripts/release.py validate --tag "$RELEASE_TAG"

      - name: Generate changelog release notes
        run: |
          set -euo pipefail
          python3 scripts/release.py notes --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --output release-notes.md

      - name: Test release tooling
        run: python3 -m unittest discover -s tests -p test_release.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: avrea-ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Generate changelog release notes
        run: |
          set -euo pipefail
          python3 scripts/release.py notes --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --output release-notes.md

      - name: Create release with curated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$RELEASE_TAG"
