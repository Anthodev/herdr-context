[package]
name = "herdr-context"
version = "0.12.0"
edition = "2024"
rust-version = "1.97.1"
autobenches = false
description = "Project context dock for Herdr"
license = "MIT"

[features]
perf-harness = []

[dependencies]
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
cap-primitives = "4.0.2"
command-group = "5.0.1"
crossterm = "0.29.0"
ignore = "0.4.25"
herdr-sqlite-vfs = { path = "crates/herdr-sqlite-vfs" }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
time = { version = "0.3.55", features = ["parsing"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.12.0"

[[bench]]
name = "performance"
harness = false
required-features = ["perf-harness"]

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
nursery = "warn"
