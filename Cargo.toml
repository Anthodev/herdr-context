[package]
name = "herdr-context"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Project context dock for Herdr"
license = "MIT"

[dependencies]
command-group = "5.0.1"
crossterm = "0.29.0"
ignore = "0.4.25"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
libc = "0.2"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
nursery = "warn"
